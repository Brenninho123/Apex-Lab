name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        shell: bash
        run: chmod +x gradlew

      - name: Build desktop fat jar
        shell: bash
        run: ./gradlew :lwjgl3:shadowJar --no-daemon

      - name: Package native executable
        shell: bash
        run: |
          "$JAVA_HOME/bin/jpackage" \
            --input lwjgl3/build/libs \
            --name ApexLab \
            --main-jar apex-lab-desktop.jar \
            --main-class com.apexlab.game.lwjgl3.Lwjgl3LauncherKt \
            --app-version 1.0.0 \
            --type app-image \
            --dest dist

      - uses: actions/upload-artifact@v4
        with:
          name: apex-lab-desktop-${{ matrix.platform }}
          path: dist

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apex-lab-android
          path: android/build/outputs/apk/debug/*.apk

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build iOS module
        run: ./gradlew :ios:build --no-daemon
