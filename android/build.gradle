apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

def debugKeystoreFile = rootProject.file("debug.keystore")

tasks.register("generateDebugKeystore") {
    outputs.file(debugKeystoreFile)
    onlyIf { !debugKeystoreFile.exists() }
    doLast {
        ant.genkey(
            alias: "androiddebugkey",
            storePass: "android",
            keyPass: "android",
            keystore: debugKeystoreFile.absolutePath,
            validity: 10000,
            keyalg: "RSA",
            keysize: 2048
        ) {
            dname {
                param(name: "CN", value: "Android Debug")
                param(name: "OU", value: "Android")
                param(name: "O", value: "Android")
                param(name: "C", value: "US")
            }
        }
    }
}

android {
    namespace = appPackage + ".android"
    compileSdk androidApiLevel.toInteger()
    buildToolsVersion androidBuildToolsVersion

    defaultConfig {
        applicationId appPackage
        minSdk androidMinSdkVersion.toInteger()
        targetSdk androidApiLevel.toInteger()
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile debugKeystoreFile
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            manifest.srcFile "src/main/AndroidManifest.xml"
            kotlin.srcDirs = ["src/main/kotlin"]
            res.srcDirs = ["src/main/res"]
            assets.srcDirs = ["../assets"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += "META-INF/robovm/ios/robovm.xml"
    }
}

dependencies {
    implementation project(":core")
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}

tasks.matching { it.name == "validateSigningDebug" }.configureEach {
    dependsOn generateDebugKeystore
}
